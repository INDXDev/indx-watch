# Weekly, grouped updates of the GitHub Actions and the npm (pnpm) dependencies.
# Runtime dependencies are listed with a reason in docs/architecture.md#dependencies: review new majors against it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    commit-message:
      prefix: build
