name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm schemas --check
      - run: pnpm check:docs
      - run: pnpm check:pure
      - run: node scripts/loc.mjs
      - run: pnpm build
      - run: pnpm check:example
      - name: Sample report is reproducible
        run: scripts/check-report.sh
      - name: Worker bundle builds (wrangler deploy --dry-run)
        run: pnpm check:worker
      - name: Pack the CLI and run the README quickstart in an empty project
        # Install the tarball like the npm package (`npx <absolute .tgz>` tries to execute the file on npm 10/11).
        # In CI a run takes its release from the CI context, so `record` names it.
        run: |
          (cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/cold" && cd "$RUNNER_TEMP/cold"
          npm init -y > /dev/null
          npm install --save-dev "$RUNNER_TEMP"/indx-watch-*.tgz
          npx indx-watch init demo
          cd demo
          npx indx-watch new uc --title "Guest applies a coupon" --ac "A valid coupon reduces the total" --priority P1 --ready
          npx indx-watch new tc --uc UC-1 --title "Valid coupon" --step "Apply SUMMER10 => Total drops by 10%" --ready
          npx indx-watch check --json
          if npx indx-watch status --gate; then echo "::error::gate passed before any run"; exit 1; fi
          npx indx-watch record TC-1 --verdict pass --step 1=pass --release v0.1.0
          npx indx-watch status --gate
          npx indx-watch report --format html --out report.html

  e2e:
    # Dogfooding: e2e/ implements this repository's own test cases (.indx-watch/), recorded by our Playwright reporter;
    # examples/shop runs its demo tests. The INDX Watch action then writes both reports to the job summary.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: examples/shop end-to-end
        run: pnpm --filter shop test
        env:
          IW_RELEASE: v1.2.0
          IW_CHECK_RUN_ID: ${{ job.check_run_id }}
      - name: Dogfood end-to-end (this repository's test cases)
        run: pnpm e2e
        env:
          IW_RELEASE: v0.1.0
          IW_CHECK_RUN_ID: ${{ job.check_run_id }}
      - name: INDX Watch summary (this repository)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          cli: local
          dir: .indx-watch
          release: v0.1.0
      - name: INDX Watch summary (examples/shop)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          cli: local
          dir: examples/shop/.indx-watch
          release: v1.2.0
          sync: "false"
