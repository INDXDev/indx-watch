name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm schemas --check
      - run: pnpm check:docs
      - run: node scripts/loc.mjs
      - run: pnpm build
      - run: pnpm check:example
      - name: Sample report is reproducible
        run: scripts/check-report.sh
      - name: Pack and cold-start the CLI in an empty directory
        run: |
          cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/cold" && cd "$RUNNER_TEMP/cold"
          npx --yes "$RUNNER_TEMP"/indx-watch-*.tgz init demo
          cd demo
          npx --yes "$RUNNER_TEMP"/indx-watch-*.tgz new uc --title "Sign up" --ac "A confirmation email is sent" --ready
          npx --yes "$RUNNER_TEMP"/indx-watch-*.tgz check --json

  e2e:
    # Dogfooding: e2e/ implements this repository's own test cases (.indx-watch/), recorded by our Playwright reporter;
    # examples/shop runs its demo tests. The INDX Watch action then writes both reports to the job summary.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: examples/shop end-to-end
        run: pnpm --filter shop test
        env:
          IW_RELEASE: v1.2.0
      - name: Dogfood end-to-end (this repository's test cases)
        run: pnpm e2e
        env:
          IW_RELEASE: v0.1.0
      - name: INDX Watch summary (this repository)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          cli: local
          dir: .indx-watch
          release: v0.1.0
      - name: INDX Watch summary (examples/shop)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          cli: local
          dir: examples/shop/.indx-watch
          release: v1.2.0
          sync: "false"
