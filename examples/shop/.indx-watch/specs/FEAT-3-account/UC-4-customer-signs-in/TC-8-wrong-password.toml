#:schema https://raw.githubusercontent.com/INDXDev/indx-watch/main/schemas/v1/test-case.json

id = "tc_01JF3Q8M5X2V7K9D4R6T1W0Y38"
key = "TC-8"
title = "Wrong password is rejected"
status = "ready"
tags = ["auth"]
covers = ["AC-4.2"]
mode = "manual"
purpose = "Only the account owner may sign in. This test proves that a wrong password is refused and the customer stays signed out."
start = "/sign-in"
start_note = "Open the sign-in page."

[[fixtures]]
ref = "FX-3"
use = "enter"
note = "Type this email with the wrong password in step 1."

[fixtures.i18n.ja]
note = "ステップ 1 でこのメールアドレスと誤ったパスワードを入力する。"
status = "machine"
source_hash = "e3fe6dbc10ea"

[[steps]]
instruction = "Open \"Sign in\", enter {{FX-3.username}} and the password \"wrong-password\", and press \"Sign in\"."
expected = "The message \"Email or password is incorrect\" appears."
checks = ["The message \"Email or password is incorrect\" appears."]
evidence = ["screenshot"]

[steps.i18n.ja]
instruction = "「Sign in」を開き、{{FX-3.username}} とパスワード「wrong-password」を入力して「Sign in」を押す。"
expected = "「Email or password is incorrect」というメッセージが表示される。"
checks = ["「Email or password is incorrect」というメッセージが表示される。"]
status = "machine"
source_hash = "64fcf8faf4f6"

[[steps]]
instruction = "Reload the page."
expected = "The header still shows \"Sign in\"."
checks = ["The header still shows \"Sign in\"."]

[steps.i18n.ja]
instruction = "ページを再読み込みする。"
expected = "ヘッダーには「Sign in」が表示されたまま。"
checks = ["ヘッダーには「Sign in」が表示されたまま。"]
status = "machine"
source_hash = "a033d251ac7d"

[[judges]]
kind = "human"

[i18n.ja]
title = "誤ったパスワードではサインインできない"
purpose = "サインインできるのはアカウントの持ち主だけです。このテストは、誤ったパスワードが拒否され、サインアウトしたままになることを確かめます。"
start_note = "サインインページを開く。"
status = "machine"
source_hash = "4173edc5371a"
