#:schema https://raw.githubusercontent.com/INDXDev/indx-watch/main/schemas/v1/test-case.json

id = "tc_01M82AJPZS087REBBP7RG0V426"
key = "TC-17"
title = "A tester sees only the features they own"
status = "draft"
origin = "ai"
covers = ["AC-9.1", "AC-9.2"]
mode = "playwright"
purpose = "A tester who owns a feature should start from it instead of the whole project. This test proves that the app opens on the viewer's features and that \"All features\" brings the rest back."
start = "/#/tests"
start_note = "Serve a copy of examples/shop as alex@shop.test (IW_ACTOR=alex@shop.test), who owns Checkout, then open Tests."

[[steps]]
instruction = "Open Tests as alex@shop.test"
expected = "Only the Checkout test cases TC-3, TC-4, TC-5 and TC-6 are listed, and the scope says My features."
checks = ["Only TC-3, TC-4, TC-5 and TC-6 are listed.", "The scope button says My features."]

[steps.i18n.ja]
instruction = "alex@shop.test としてテストを開く。"
expected = "Checkout のテストケース TC-3、TC-4、TC-5、TC-6 だけが表示され、スコープに My features と表示される。"
checks = ["TC-3、TC-4、TC-5、TC-6 だけが表示される。", "スコープのボタンに My features と表示される。"]
status = "machine"
source_hash = "b93c0220280c"

[[steps]]
instruction = "Choose All features in the scope menu, then reload the page"
expected = "Every test case of the shop is listed again, and All features is still chosen after the reload."
checks = ["TC-1 and TC-9 are listed again.", "After the reload, All features is still chosen."]

[steps.i18n.ja]
instruction = "スコープメニューで All features を選び、ページを再読み込みする。"
expected = "ショップのすべてのテストケースが再び表示され、再読み込みの後も All features が選ばれている。"
checks = ["TC-1 と TC-9 が再び表示される。", "再読み込みの後も All features が選ばれている。"]
status = "machine"
source_hash = "83543aa3206d"

[[judges]]
kind = "assert"

