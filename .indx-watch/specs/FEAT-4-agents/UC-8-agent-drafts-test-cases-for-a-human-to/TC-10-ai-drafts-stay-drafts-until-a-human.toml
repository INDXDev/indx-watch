key = "TC-10"
title = "AI drafts stay drafts until a human approves"
status = "ready"
tags = ["agents"]
covers = ["AC-8.1", "AC-8.2"]
mode = "playwright"

[[steps]]
instruction = "Run \"iw new tc --origin ai --model test-model\" on a copy of examples/shop."
expected = "The file has status \"draft\", origin \"ai\" and an [ai] table."

[steps.i18n.ja]
instruction = "examples/shop のコピーで「iw new tc --origin ai --model test-model」を実行する。"
expected = "ファイルは status「draft」、origin「ai」で、[ai] テーブルを持つ。"
status = "machine"
source_hash = "6bbbbc787e56"

[[steps]]
instruction = "Run \"iw approve\" on it with IW_ACTOR_KIND=agent, then as a human."
expected = "The agent attempt exits 2; the human approval sets status \"ready\" and approved_by."

[steps.i18n.ja]
instruction = "IW_ACTOR_KIND=agent で「iw approve」を実行し、次に人として実行する。"
expected = "エージェントとしての実行は終了コード 2 で終わり、人の承認で status が「ready」になり approved_by が設定される。"
status = "machine"
source_hash = "26af160ae50a"

